<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار أصوات التنبيهات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .alert-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        .alert-btn {
            padding: 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .critical { background: #ef4444; color: white; }
        .high { background: #f97316; color: white; }
        .medium { background: #eab308; color: black; }
        .low { background: #3b82f6; color: white; }
        .alert-btn:hover { transform: scale(1.05); }
        .status { margin-top: 20px; padding: 10px; background: white; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>اختبار أصوات التنبيهات</h1>
    <p>انقر على أي زر لسماع الصوت المرتبط بالتنبيه:</p>

    <div class="alert-buttons">
        <button class="alert-btn critical" onclick="playSound('Critical')">🔴 حريق مكتشف</button>
        <button class="alert-btn high" onclick="playSound('High')">🟠 تنبيه خطير</button>
        <button class="alert-btn medium" onclick="playSound('Medium')">🟡 تنبيه متوسط</button>
        <button class="alert-btn low" onclick="playSound('Low')">🔵 تنبيه منخفض</button>
    </div>

    <div class="status" id="status">
        الحالة: جاهز للاختبار
    </div>

    <script>
        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContextClass();
                console.log('Audio context initialized:', audioContext.state);
            }

            // Resume if suspended
            if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    console.log('Audio context resumed');
                });
            }

            return audioContext;
        }

        function playSound(level) {
            console.log('🎵 Playing sound for level:', level);
            document.getElementById('status').textContent = `جاري تشغيل صوت: ${level}`;

            try {
                const audioContext = initAudio();

                let frequency = 800;
                let duration = 0.3;
                let repetitions = 1;

                switch (level) {
                    case 'Critical':
                        frequency = 800;
                        duration = 0.2;
                        repetitions = 5;
                        console.log('🔴 Critical: 5 beeps at 800Hz');
                        break;
                    case 'High':
                        frequency = 600;
                        duration = 0.3;
                        repetitions = 3;
                        console.log('🟠 High: 3 beeps at 600Hz');
                        break;
                    case 'Medium':
                        frequency = 400;
                        duration = 0.5;
                        repetitions = 1;
                        console.log('🟡 Medium: 1 tone at 400Hz');
                        break;
                    case 'Low':
                        frequency = 300;
                        duration = 0.3;
                        repetitions = 1;
                        console.log('🔵 Low: 1 soft tone at 300Hz');
                        break;
                }

                const playTone = (freq, dur) => {
                    try {
                        const oscillator = audioContext.createOscillator();
                        const gainNode = audioContext.createGain();

                        oscillator.connect(gainNode);
                        gainNode.connect(audioContext.destination);

                        oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
                        oscillator.type = 'sine';

                        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + dur);

                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + dur);

                        console.log(`🎵 Played tone: ${freq}Hz for ${dur}s`);
                    } catch (error) {
                        console.log('❌ Tone playback failed:', error);
                    }
                };

                // Play multiple tones
                for (let i = 0; i < repetitions; i++) {
                    setTimeout(() => playTone(frequency, duration),
                             i * (duration + 0.1) * 1000);
                }

                setTimeout(() => {
                    document.getElementById('status').textContent = 'تم تشغيل الصوت بنجاح ✅';
                }, (repetitions * (duration + 0.1) + 1) * 1000);

            } catch (error) {
                console.log('❌ Audio playback failed:', error);
                document.getElementById('status').textContent = `خطأ في تشغيل الصوت: ${error.message}`;
            }
        }

        // Initialize audio on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded, audio system ready');

            // Initialize audio context on first user interaction
            document.addEventListener('click', function init() {
                initAudio();
                document.removeEventListener('click', init);
            });
        });
    </script>
</body>
</html>
